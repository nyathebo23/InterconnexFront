<div class="container-fluid">
    <div class="d-flex flex-column">
        <div class="card-form-small mb-5">
            <h2 class="form-title">{{'InformateurLocal.title' | translate }}</h2>
            <div [formGroup]="infLocalForm">
                <div class="form-group mb-4">
                    <input type="text" formControlName="name" class="form-control" [ngClass]="{'red-border' : infLocalForm.controls.name.invalid && infLocalForm.controls.name.dirty}" placeholder="{{'InformateurLocal.name' | translate }}" />
                    <app-control-messages [control]="infLocalForm.controls.name"></app-control-messages>
                </div>
                <div class="form-group mb-4">
                    <select class="form-control" formControlName="aerodrome">
                        <option selected disabled [value]="undefined">Aerodromes</option>
                        <option [value]="">-----</option>
                        <option *ngFor="let aerodrome of aerodromesList" [value]="aerodrome.id">{{aerodrome.name}}</option>
                    </select>
                </div>
                <div class="form-group mb-4" *ngIf="isAerodromeLocalInf()">
                    <select class="form-control" formControlName="unit">
                        <option selected disabled [value]="null">Unités source de l'aérodrome</option>
                        <option *ngFor="let unitsource of unitsList" [value]="unitsource.id" >{{unitsource.name}}</option>
                    </select>
                </div>
                <div>
                    <button mdbBtn type="button" class="roundedbtn m-auto" (click)="submit()" color="deep-purple" mdbWavesEffect>Submit</button>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table mdbTable>
                <thead class="pretty-head">
                    <tr>
                        <th *ngFor="let head of headsInfLocal" scope="col">{{head | translate}} </th>
                    </tr>
                </thead>
                <tbody>
                    <tr mdbTableCol *ngFor="let elt of inflocaux;">
                        <th scope="row">{{elt.id}}</th>
                        <td>{{elt.name}}</td>
                        <td><button mdbBtn type="button" class="roundedbtn" (click)="edit(elt)" color="amber" mdbWavesEffect>{{'UpdateDelete.editBtn' | translate}}</button></td>
                        <td><button mdbBtn type="button" class="roundedbtn" (click)="delete(elt)" color="danger" mdbWavesEffect>{{'UpdateDelete.deleteBtn' | translate}}</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
