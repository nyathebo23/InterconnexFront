<div class="background-form">
    <div>
        <img src="/assets/images/ccaa.png" height="100" alt="CCAA LOGO">
    </div>

    <div class="card-form">
        <h2 class="form-title">{{'AUTHFORMS.PASSWORDRESET2.title' | translate }}</h2>

        <form [formGroup]="passwordResetForm">
            <div class="form-group mb-4">
                <input type="text" formControlName="code" class="form-control cust-input" [ngClass]="{'red-border' : passwordResetForm.controls.code.invalid && passwordResetForm.controls.code.dirty}" placeholder="{{'AUTHFORMS.PASSWORDRESET2.code' | translate }}" />
                <app-control-messages [control]="passwordResetForm.controls.code"></app-control-messages>
            </div>
            <div class="form-group mb-4">
                <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" class="form-control cust-input" placeholder="{{'AUTHFORMS.PASSWORDRESET2.newpassword' | translate }}" [ngClass]="{'red-border' : passwordResetForm.controls.newPassword.invalid && passwordResetForm.controls.newPassword.dirty}">
                <i [ngClass]="showNewPassword ? 'fa fa-eye field-icon' : 'fa fa-eye-slash field-icon'" (click)="toggleNewPasswordVisibility()"></i>
                <app-control-messages [control]="passwordResetForm.controls.newPassword"></app-control-messages>
            </div>
            <div class="form-group mb-5">
                <input [type]="showConfNewPassword ? 'text' : 'password'" formControlName="confirmNewPassword" class="form-control cust-input" placeholder="{{'AUTHFORMS.PASSWORDRESET2.confirmnewpassword' | translate }}" [ngClass]="{'red-border' : passwordResetForm.controls.confirmNewPassword.invalid && passwordResetForm.controls.confirmNewPassword.dirty}">
                <i [ngClass]="showConfNewPassword ? 'fa fa-eye field-icon' : 'fa fa-eye-slash field-icon'" (click)="toggleConfNewPasswordVisibility()"></i>
                <app-control-messages [control]="passwordResetForm.controls.confirmNewPassword"></app-control-messages>
            </div>
            <div class="form-group">
                <button [disabled]="passwordResetForm.invalid" class="custom-btn m-auto" mdbBtn type="button" color="deep-purple" mdbWavesEffect>
                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                    {{'AUTHFORMS.PASSWORDRESET2.submitBtn' | translate }}                    
                </button>
                <!-- <button [disabled]="passwordResetForm.invalid" class="btn btn-blue btn-flat" (click)="submit()">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                    {{'AUTHFORMS.PASSWORDRESET2.submitBtn' | translate }}
                </button> -->
            </div>
        </form>
    </div>
</div>
