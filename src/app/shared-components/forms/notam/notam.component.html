<div class="d-flex flex-column flex-sm-column flex-md-column flex-lg-column flex-xl-column mt-2 mb-3" [formGroup]="notamForm">
    <div class="d-flex flex-column">
        <h1 class="ddia-title"> {{'DDIAFORMS.notam.title' | translate}} </h1>
        <mdb-carousel [isControls]="true" [interval]="'0'" [animation]="'slide'">
            <mdb-carousel-item>
                <div class="ddia-form">
                    <div class="alert alert-danger" role="alert" *ngFor="let err of errors">
                        {{err | translate}}
                    </div>
                    <div class="container-fluid">
                        <div class="form-group">
                            <label for="date-time" class="custom-label">{{'DDIAFORMS.depositDateTime' | translate }}</label>
                            <input type="text" id="date-time" class="form-control" [owlDateTimeTrigger]="dt1" [owlDateTime]="dt1" formControlName="depositDateTime">
                            <owl-date-time #dt1></owl-date-time>
                        </div>
                        <app-source-unit-form></app-source-unit-form>
                        <div>
                            <div class="form-group">
                                <label for="typeNOTAM" class="custom-label">{{'DDIAFORMS.notam.notamType' | translate}}:</label>
                                <div class="d-flex flex-wrap justify-content-between">
                                    <div class="custom-control custom-radio">
                                        <input id="notamN" type="radio" class="custom-control-input" value="NOTAM N" formControlName="typeNOTAM" mdbInput>
                                        <label for="notamN" class="custom-control-label">NOTAM N</label>
                                    </div>
                                    <div class="custom-control custom-radio">
                                        <input id="notamR" type="radio" class="custom-control-input" value="NOTAM R" formControlName="typeNOTAM" mdbInput>
                                        <label for="notamR" class="custom-control-label">NOTAM R</label>
                                    </div>
                                    <div class="custom-control custom-radio">
                                        <input id="notamC" type="radio" class="custom-control-input" value="NOTAM C" formControlName="typeNOTAM" mdbInput>
                                        <label for="notamC" class="custom-control-label">NOTAM C</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group mb-2">
                                <label for="targetNOTAM" class="custom-label">{{'DDIAFORMS.notam.notamTargetCode' | translate }}</label>
                                <input type="text" id="targetNOTAM" class="form-control" formControlName="notamTargetCode">
                                <app-control-messages [control]="notamForm.controls.notamTargetCode"></app-control-messages>

                                <!-- <select [disabled]="!isReplaceNOTAM()" class="form-control" id="targetNOTAM">
                                    <option value=""></option>
                                </select> -->
                            </div>
                            <div class="form-group">
                                <label for="coords" class="custom-label">{{'DDIAFORMS.notam.coords' | translate }}</label>
                                <input type="text" id="coords" class="form-control" formControlName="coords">
                            </div>
                            <div class="form-group">
                                <label for="rangeAct" class="custom-label">{{'DDIAFORMS.notam.rangeAction' | translate }}</label>
                                <input type="text" id="rangeAct" class="form-control" formControlName="rangeAction">
                            </div>
                        </div>
                    </div>
                </div>
            </mdb-carousel-item>
            <mdb-carousel-item>
                <div class="ddia-form">
                    <div class="alert alert-danger" role="alert" *ngFor="let err of errors">
                        {{err | translate}}
                    </div>
                    <div class="container-fluid">
                        <div class="form-group">
                            <label class="custom-label">{{'DDIAFORMS.notam.valPeriod' | translate }}</label>
                            <div class="form-group">
                                <input type="text" placeholder="Validity period" class="form-control" [owlDateTimeTrigger]="dtPicker" [owlDateTime]="dtPicker" formControlName="validityPeriod" [selectMode]="'range'">
                                <owl-date-time #dtPicker></owl-date-time>
                                <app-control-messages [control]="notamForm.controls.validityPeriod"></app-control-messages>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="periodType" class="custom-label">{{'DDIAFORMS.notam.periodType' | translate}}:</label>
                            <div class="d-flex justify-content-between">
                                <div class="custom-control custom-radio">
                                    <input id="period1" type="radio" class="custom-control-input" value="planned" formControlName="periodType" mdbInput>
                                    <label for="period1" class="custom-control-label">{{'DDIAFORMS.notam.plannedPeriod' | translate}}</label>
                                </div>
                                <div class="custom-control custom-radio">
                                    <input id="period2" type="radio" class="custom-control-input" value="estimated" formControlName="periodType" mdbInput>
                                    <label for="period2" class="custom-control-label">{{'DDIAFORMS.notam.estimatedPeriod' | translate}}</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="custom-label">{{'DDIAFORMS.notam.dailyFreq' | translate }}</label>
                            <div class="d-flex flex-wrap align-items-center justify-content-between">
                                <div>
                                    <input type="time" id="input1" class="form-control" formControlName="dailyFreqStart" mdbInput />
                                </div>
                                <div>
                                    <input type="time" id="input2" class="form-control" formControlName="dailyFreqEnd" mdbInput />
                                </div>
                                <!-- <timepicker [showMeridian]="false" formControlName="dailyFreqStart" [showSpinners]="false"></timepicker>
                                <span>à</span>
                                <timepicker [showMeridian]="false" formControlName="dailyFreqEnd" [showSpinners]="false"></timepicker> -->
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="dailyFreqType" class="custom-label">{{'DDIAFORMS.notam.dailyFreqType' | translate}}:</label>
                            <div class="d-flex justify-content-between">
                                <div class="custom-control custom-radio">
                                    <input id="dailyperiod1" type="radio" class="custom-control-input" value="planned" formControlName="dailyFreqType" mdbInput>
                                    <label for="dailyperiod1" class="custom-control-label">{{'DDIAFORMS.notam.plannedPeriod' | translate}}</label>
                                </div>
                                <div class="custom-control custom-radio">
                                    <input id="dailyperiod2" type="radio" class="custom-control-input" value="estimated" formControlName="dailyFreqType" mdbInput>
                                    <label for="dailyperiod2" class="custom-control-label">{{'DDIAFORMS.notam.estimatedPeriod' | translate}}</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="descText" class="custom-label">{{'DDIAFORMS.notam.text' | translate }}</label>
                            <textarea class="form-control" formControlName="text" id="descText" cols="30" rows="7"></textarea>
                            <app-control-messages [control]="notamForm.controls.text"></app-control-messages>
                        </div>
                        <div class="form-group">
                            <label class="custom-label">{{'DDIAFORMS.notam.vertLimits' | translate }}</label>
                            <div class="row">
                                <div class="col-sm-6 col-md-6">
                                    <input type="text" placeholder="{{'DDIAFORMS.notam.lowerLim' | translate }}" class="form-control" formControlName="infLimit">
                                </div>
                                <div class="col-sm-6 col-md-6">
                                    <input type="text" placeholder="{{'DDIAFORMS.notam.upperLim' | translate }}" class="form-control" formControlName="supLimit">
                                </div>
                            </div>
                        </div>

                        <div formArrayName="filesForm" class="form-group">
                            <label class="custom-label">{{'DDIAFORMS.notam.files' | translate }}</label>
                            <div *ngFor="let fileForm of files.controls;let index=index;">
                                <div [formGroupName]="index" class="d-flex flex-wrap justify-content-start align-items-center">
                                    <div>
                                        <button mdbBtn type="button" color="primary" mdbWavesEffect outline="true" style="height: 43px; overflow: hidden;" (click)="fileUpload.click()"> 
                                            <span>{{'DDIAFORMS.sourceunit.addfile' | translate }}&nbsp;<i class="fas fa-paperclip"></i></span>
                                            <input type="file" #fileUpload class="file-input" (change)="onFileSelected($event, fileForm)">
                                        </button>
                                    </div>
                                    <div>
                                        <input type="text" formControlName="filename" [disabled]="true" class="form-control">
                                    </div>
                                    <div>
                                        <button mdbBtn type="button" color="primary" mdbWavesEffect (click)="removeFileForm()" style="height: 43px;">
                                            <mdb-icon fas icon="minus" size="lg"></mdb-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-5">
                            <button mdbBtn type="button" color="primary" mdbWavesEffect (click)="addFileForm()">
                                <mdb-icon fas icon="plus" size="lg"></mdb-icon> &nbsp; {{'DDIAFORMS.buttons.plusonefile' | translate }}
                            </button>
                        </div>
                    </div>
                </div>
            </mdb-carousel-item>
        </mdb-carousel>
    </div>

    <div class="d-flex flex-wrap justify-content-around mt-4">
        <button mdbBtn type="button" color="primary" outline="true" mdbWavesEffect (click)="initForm()">
            {{'DDIAFORMS.buttons.reinit' | translate }}
        </button>
        <button type="button" [disabled]="notamForm.invalid || loadingSave" mdbBtn color="primary" mdbWavesEffect (click)="save()">
            <span *ngIf="loadingSave" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> &nbsp;{{'DDIAFORMS.buttons.save' | translate }}
        </button>
    </div>
</div>
