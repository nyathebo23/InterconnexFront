<div class="modal-content">
    <div class="modal-header">
        <h4 class="heading">CONFIRMATION</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="modalRef.hide()">
        <span aria-hidden="true" class="text-white">&times;</span>
    </button>
    </div>
    <div class="modal-body">
        <p translate [translateParams]="{typeDDIA: ddiaType}">
            {{contentText}}
        </p>
    </div>
    <div class="modal-footer">
        <a type="button" mdbBtn color="info" outline="true" class="waves-effect" mdbWavesEffect data-dismiss="modal" (click)="modalRef.hide()">{{'MODAL.cancel' | translate}}</a>
        <a type="button" mdbBtn color="info" class="waves-effect" mdbWavesEffect (click)="functionToTrigger()"><span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> &nbsp; {{'MODAL.ok' | translate}}</a>
    </div>
</div>
