<div class="jumbotron p-0">
    <blockquote class="blockquote bq-primary">
        <p class="bq-title"> </p>
        <p [translate]="contentText" [translateParams]="{typeDDIA: notification.typeDDIA, refDDIA: notification.refDDIA}"> </p>
        <footer class="blockquote-footer">Received on <cite title="date"> {{ date }} </cite></footer>
        <hr>
    </blockquote>
</div>
