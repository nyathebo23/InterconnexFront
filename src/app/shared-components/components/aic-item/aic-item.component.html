<a style="text-decoration: none;" [routerLink]="['/'+pathToExtend, id]">
    <div class="ddia-item-box">
        <div class="d-flex flex-column p-l-20">
            <div class="mb-1">
                <h4 class="text-gradient">AIC &nbsp;[{{state}}]</h4>
            </div>
            <div class="text-one-line bold-italic mb-2">
                {{ 'ddialist.reference' | translate }}: {{reference}}
            </div>
            <div class="text-one-line mb-2" translate [translateParams]="{unitname: unitname, airportname: airportname }">
                ddialist.ddiaitem.init
            </div>
            <div class="text-one-line mb-2" *ngIf="object">
                {{'DDIAFORMS.object' | translate }}: {{object}}
            </div>
            <div class="text-one-line mb-2">
                {{'DDIAFORMS.descText' | translate }}: {{text}}
            </div>
            <div class="d-flex justify-content-end">
                <div class="date">
                    <small>{{action | translate }} &nbsp; {{actionDate}}</small>
                </div>
            </div>
        </div>
    </div>
</a>
