<div class="modal-dialog modal-side modal-center modal-notify modal-info" role="document">
    <!--Content-->
    <div class="modal-content">
        <!--Header-->
        <div class="modal-header">
            <p class="heading">CONFIRMATION</p>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeFunction()">
          <span aria-hidden="true" class="text-white">&times;</span>
        </button>
        </div>

        <!--Body-->
        <div class="modal-body">
            <p translate [translateParams]="{typeDDIA: ddiaType}">
                {{contentText}}
            </p>
        </div>

        <!--Footer-->
        <div class="modal-footer justify-content-center">
            <a type="button" mdbBtn color="info" class="waves-effect" mdbWavesEffect (click)="functionToTrigger()">{{'MODAL.ok' | translate}}</a>
            <a type="button" mdbBtn color="info" outline="true" class="waves-effect" mdbWavesEffect data-dismiss="modal" (click)="closeFunction()">{{'MODAL.cancel' | translate}}</a>
        </div>
    </div>
    <!--/.Content-->
</div>
