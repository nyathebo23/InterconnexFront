<div class="ddia-item-round">
    <div class="d-flex flex-column p-l-20">
        <div class="idents-label mb-3">
            NOTAM ({{type}}) [{{state}}]
        </div>
        <div class="text-one-line mb-2">
            {{ 'ddialist.reference' | translate }}: {{id}}
        </div>
        <div class="text-one-line mb-2" translate [translateParams]="{unitname: unitname, airportname: airportname }">
            ddialist.ddiaitem.init
        </div>
        <div class="d-flex flex-column mb-2">
            <div>{{'DDIAFORMS.notam.valPeriod' | translate }} ({{periodType}}): </div>
            <div class="d-flex flex-wrap justify-content-between">
                <div class="text-one-line">{{validityPeriodStart}}</div>
                <div>-</div>
                <div class="text-one-line">{{validityPeriodEnd}}</div>
            </div>
        </div>
        <div class="text-one-line mb-2">
            {{'DDIAFORMS.notam.text' | translate }}: {{text}}
        </div>
        <div class="d-flex justify-content-end">
            <div class="date">
                Admis le 28/5/2019 à 20:12
            </div>
        </div>
    </div>
</div>
