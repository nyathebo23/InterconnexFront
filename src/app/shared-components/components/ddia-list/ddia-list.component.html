<div class="container-fluid">
    <div class="d-flex flex-column">
        <div class="label-title mb-4">
            {{ labelTitle | translate }}
        </div>
        <div class="row">
            <div class="col-xl-3 col-lg-4 col-md-4 col-sm-12">
                <div class="d-flex flex-column filters-box justify-content-center">
                    <h3 class="mb-4">{{'ddialist.filterstitle' | translate}}</h3>
                    <div class="form-group mt-4 mb-4" *ngIf="statesList">
                        <label class="custom-label" for="state">{{'ddialist.state' | translate}}</label>
                        <select class="form-control" id="state" (change)="changeState($event)">
                            <option *ngFor="let stateElt of statesList" [value]="stateElt.stateValue" [selected]="stateElt.stateValue === 'all'"> {{stateElt.stateLabel | translate}} </option>
                        </select>
                    </div>
                    <div class="form-group mb-4">
                        <label class="custom-label" for="type">{{'ddialist.type' | translate}}</label>
                        <select class="form-control" id="type" (change)="changeType($event)">
                            <option value="all" *ngIf="ddiaActionsList" selected>All</option>
                            <option value="notam" [selected]="ddiaList !== undefined">NOTAM</option>
                            <option value="suppaip">SUPP AIP</option>
                            <option value="aic">AIC</option>
                        </select>
                    </div>
                    <div class="form-group mb-4">
                        <label class="custom-label" for="date">{{'ddialist.date' | translate}}</label>
                        <select class="form-control" id="date" (change)="changeDateOrder($event)">
                            <option value="ascendingDate" selected>{{'ddialist.dateOldToNew' | translate}}</option>
                            <option value="descendingDate">{{'ddialist.dateNewToOld' | translate}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-8 col-sm-12">
                <div class="d-flex flex-column">
                    <div class="container-items">
                        <ngx-ui-loader [loaderId]="loaderId"></ngx-ui-loader>
                        <div class="d-flex flex-column vertical-overflow" *ngIf="ddiaActionsList">
                            <app-empty-ddia-list *ngIf="ddiaActionsList.length === 0"></app-empty-ddia-list>
                            <app-ddia-item *ngFor="let ddiaAction of ddiaActionsList" [actionOnDDIA]="ddiaAction"></app-ddia-item>
                        </div>
                        <div class="d-flex flex-column vertical-overflow" *ngIf="ddiaList">
                            <app-empty-ddia-list *ngIf="ddiaList.length === 0"></app-empty-ddia-list>
                            <app-ddia-item *ngFor="let ddiaItem of ddiaList" [ddiaItem]="ddiaItem"></app-ddia-item>
                        </div>
                    </div>
                    <div class="bg-white p-t-10">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination pagination-circle pg-blue">
                                <li class="page-item disabled"><a class="page-link" mdbWavesEffect>First</a></li>
                                <li class="page-item disabled">
                                    <a class="page-link" aria-label="Previous" mdbWavesEffect>
                                        <span aria-hidden="true">&laquo;</span>
                                        <span class="sr-only">Previous</span>
                                    </a>
                                </li>
                                <li class="page-item active"><a class="page-link" mdbWavesEffect>1</a></li>
                                <li class="page-item"><a class="page-link" mdbWavesEffect>2</a></li>
                                <li class="page-item"><a class="page-link" mdbWavesEffect>3</a></li>
                                <li class="page-item"><a class="page-link" mdbWavesEffect>4</a></li>
                                <li class="page-item"><a class="page-link" mdbWavesEffect>5</a></li>
                                <li class="page-item">
                                    <a class="page-link" aria-label="Next" mdbWavesEffect>
                                        <span aria-hidden="true">&raquo;</span>
                                        <span class="sr-only">Next</span>
                                    </a>
                                </li>
                                <li class="page-item"><a class="page-link" mdbWavesEffect>Last</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
