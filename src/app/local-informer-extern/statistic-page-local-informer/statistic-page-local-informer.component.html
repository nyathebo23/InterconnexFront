<div class="container-fluid mt-3">
    <div class="bg-white z-depth-1-half" style="min-height: 600px;">
        <div class="d-flex flex-wrap justify-content-around">
            <div class="form-group">
                <select class="form-control" id="typesDDIA" (change)="changeSpecifDDIADisplayed($event)">
                    <option value="no"> {{'CCAALOCALINFORMER.statsView.publishedDDIA' | translate}} </option>
                    <option value="yes" selected> {{'CCAALOCALINFORMER.statsView.allDDIA' | translate}} </option>
                </select>
            </div>
            <div class="form-group">
                <select class="form-control" (change)="changeYear($event)">
                    <option *ngFor="let year of yearsList" [value]="year" [selected]="year === actualYear"> {{year}} </option>
                </select>
            </div>
        </div>
        <div style="display: block; margin: auto;">
            <canvas mdbChart [chartType]="chartType" [datasets]="chartDatasets" [labels]="aerodromesNames" [options]="chartOptions" [legend]="true" (chartHover)="chartHovered($event)" (chartClick)="chartClicked($event)">
            </canvas>
        </div>
    </div>
</div>
